<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novu Advisor - Admin Login</title>
  <link rel="stylesheet" href="./assets/dashboard.css">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:18px;">
    <section class="db-card" style="width:min(460px,96vw);">
      <h1 class="db-title" style="margin-bottom:6px;">Novu Advisor</h1>
      <p class="db-subtitle">Sign in to your business dashboard.</p>
      <form id="login-form" class="db-grid" style="margin-top:14px;">
        <div>
          <label class="db-label" for="business_id">Business ID</label>
          <input id="business_id" class="db-input db-mono" required placeholder="uuid">
        </div>
        <div>
          <label class="db-label" for="password">Admin Password</label>
          <input id="password" type="password" class="db-input" required placeholder="••••••••">
        </div>
        <div>
          <label class="db-label" for="api_url">API URL</label>
          <input id="api_url" class="db-input db-mono" value="" placeholder="https://your-domain.com">
        </div>
        <button class="db-btn db-btn-primary" type="submit">Log in</button>
      </form>
      <p class="db-subtitle" style="margin-top:12px;">
        New here? <a href="./setup.html" style="text-decoration:underline;">Create your business</a>
      </p>
      <p class="db-subtitle" style="margin-top:6px;">
        Managing multiple clients? <a href="./clients.html" style="text-decoration:underline;">Open Super Admin clients</a>
      </p>
    </section>
  </main>
  <script src="./assets/dashboard.core.js"></script>
  <script src="./assets/dashboard.js"></script>
</body>
</html>
